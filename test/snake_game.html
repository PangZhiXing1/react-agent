 <!DOCTYPE html>
<html>
<head>
  <title>贪吃蛇游戏</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; }
    canvas { border: 1px solid black; background-color: #f0f0f0; }
    h1 { text-align: center; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>贪吃蛇游戏</h1>
  <button id="startButton">开始游戏</button>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    // Simple Snake Game for Beginners
    // Modified to include a start button and manage game state
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let snake = [{
      x: 200,
      y: 200
    }];  // Snake initial position as an array of segments
    let food = {
      x: 100,
      y: 100
    };  // Food position
    let dx = 10;  // Direction X (right)
    let dy = 0;   // Direction Y
    let gameLoop; // For game loop
    let score = 0;
    let gameStarted = false; // Flag to indicate if game is running

    // Function to reset game state
    function resetGame() {
      snake = [{
        x: 200,
        y: 200
      }];
      food = {
        x: 100,
        y: 100
      };
      dx = 10;
      dy = 0;
      score = 0;
      drawGame(); // Redraw initial state
    }

    // Function to draw the game
    function drawGame() {
      // Clear the canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw snake
      ctx.fillStyle = 'green';
      snake.forEach(segment => {
        ctx.fillRect(segment.x, segment.y, 10, 10);
      });
      
      // Draw food
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x, food.y, 10, 10);
      
      // Update score
      ctx.fillStyle = 'black';
      ctx.font = '20px Arial';
      ctx.fillText('Score: ' + score, 10, 30);  // Display score
    }
    
    // Function to move the snake
    function moveSnake() {
      if (!gameStarted) return; // Do nothing if game hasn't started
      
      // Move snake by adding new head
      let head = snake[0];
      let newHead = {
        x: head.x + dx,
        y: head.y + dy
      };
      
      // Check for collision with walls or self
      if (newHead.x < 0 || newHead.x >= canvas.width || newHead.y < 0 || newHead.y >= canvas.height ||
          collision(newHead)) {
        clearInterval(gameLoop);
        alert('Game Over! Final Score: ' + score);
        resetGame(); // Reset game state
        return;
      }
      
      // Add new head
      snake.unshift(newHead);
      
      // Check for food
      if (newHead.x === food.x && newHead.y === food.y) {
        // Increase score and generate new food
        score += 10;
        generateFood();
        drawGame(); // Redraw with new food
        return; // Don't draw immediately after, food generation handles it
      }
      
      // Remove tail if no food eaten
      snake.pop();
      
      // Draw the game after moving
      drawGame();
    }
    
    // Function to generate food at random position
    function generateFood() {
      let availableX = Math.floor(Math.random() * (canvas.width / 10)) * 10;
      let availableY = Math.floor(Math.random() * (canvas.height / 10)) * 10;
      food = {
        x: availableX,
        y: availableY
      };
    }
    
    // Function to check collision with self
    function collision(position) {
      for (let i = 0; i < snake.length; i++) {
        if (position.x === snake[i].x && position.y === snake[i].y) {
          return true;
        }
      }
      return false;
    }
    
    // Function to change direction
    function changeDirection(event) {
      if (!gameStarted) return; // Cannot change direction if game hasn't started
      
      const keyPressed = event.keyCode;
      const LEFT = 37;
      const RIGHT = 39;
      const UP = 38;
      const DOWN = 40;
      
      const goingUp = dy === -10;
      const goingDown = dy === 10;
      const goingRight = dx === 10;
      const goingLeft = dx === -10;
      
      // Prevent reversing direction
      if (keyPressed === LEFT && !goingRight) {  // If pressing left and not coming from right
        dx = -10;
        dy = 0;
      } else if (keyPressed === UP && !goingDown) {
        dx = 0;
        dy = -10;
      } else if (keyPressed === RIGHT && !goingLeft) {
        dx = 10;
        dy = 0;
      } else if (keyPressed === DOWN && !goingUp) {
        dx = 0;
        dy = 10;
      }
    }
    
    // Event listener for keyboard input
    document.addEventListener('keydown', changeDirection);
    
    // Event listener for the start button
    document.getElementById('startButton').addEventListener('click', () => {
      resetGame();
      gameStarted = true;
      drawGame(); // Draw the initial game state
      generateFood();
      gameLoop = setInterval(moveSnake, 100); // Start the game loop
    });
  </script>
</body>
</html>
